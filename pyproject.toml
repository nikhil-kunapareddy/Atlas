[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-context"
version = "0.2.0"
description = "Turn a folder of PDFs, spreadsheets, images, audio and video into a graph your agent can query."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sai Nikhil Kunapareddy" }]
keywords = ["knowledge-graph", "rag", "mcp", "multimodal", "agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]

# The core is deliberately dependency-free: stdlib sqlite3 with FTS5 stores and
# queries the graph. Every modality is an extra, so `pip install atlas-context`
# stays small and each capability is opt-in.
dependencies = []

[project.optional-dependencies]
pdf     = ["pypdf>=4.0"]
sheets  = ["openpyxl>=3.1"]
images  = ["pillow>=10.0"]
office  = ["python-docx>=1.1", "python-pptx>=0.6.23"]
media   = ["faster-whisper>=1.0"]
ocr     = ["pytesseract>=0.3.10", "pillow>=10.0"]
llm     = ["anthropic>=0.40"]
mcp     = ["mcp>=1.2.0"]
embeddings = ["sentence-transformers>=3.0", "numpy>=1.24"]

# Everything a laptop needs to read every modality, without the GPU-sized bits.
docs-all = [
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
]
all = [
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "faster-whisper>=1.0",
    "pytesseract>=0.3.10",
    "anthropic>=0.40",
    "mcp>=1.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/nikhil-kunapareddy/Atlas"
Issues = "https://github.com/nikhil-kunapareddy/Atlas/issues"

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises a real model or a large file",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is ruff-format's job, not the linter's
    "B008",    # argparse and dataclass patterns rely on calls in defaults
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["src/atlas"]
ignore_missing_imports = true
warn_unused_ignores = true
# The extractors deliberately traffic in Any: every optional dependency is
# imported dynamically, so their return types are unknowable at check time.
disallow_untyped_defs = false
